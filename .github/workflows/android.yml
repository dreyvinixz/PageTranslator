name: Android APK · Preview v1
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PageTranslator-v1.0.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish first v1.0.0 preview release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "Release v1.0.0 exists; updating its notes only."
            gh release edit v1.0.0 --notes-file docs/RELEASE_v1.0.0.md
          else
            sha256sum app/build/outputs/apk/debug/app-debug.apk > APK-SHA256.txt
            gh release create v1.0.0 \
              app/build/outputs/apk/debug/app-debug.apk#PageTranslator-v1.0.0-debug.apk \
              APK-SHA256.txt \
              --title "PageTranslator v1.0.0 · Preview" \
              --notes-file docs/RELEASE_v1.0.0.md \
              --target "$GITHUB_SHA" \
              --prerelease
          fi
