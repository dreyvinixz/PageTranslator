name: Browser Extension · Preview

on:
  push:
    paths:
      - "browser-extension/**"
      - ".github/workflows/browser-extension.yml"
  pull_request:
    paths:
      - "browser-extension/**"
      - ".github/workflows/browser-extension.yml"
  workflow_dispatch:

jobs:
  build-chromium-extension:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: browser-extension
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build MV3 extension
        working-directory: browser-extension
        run: npm run build
      - name: Verify extension assets
        working-directory: browser-extension
        run: |
          npm run verify
          node --check background.js
          node --check content.js
          node --check offscreen.js
      - name: Package unpacked extension
        run: |
          cd browser-extension/dist
          zip -r "$GITHUB_WORKSPACE/PageTranslator-browser-v0.1.0-preview.zip" .
      - name: Upload preview ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PageTranslator-browser-v0.1.0-preview
          path: PageTranslator-browser-v0.1.0-preview.zip
          retention-days: 30
