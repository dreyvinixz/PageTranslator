name: Browser Finder · Diagnostic Preview

on:
  push:
    paths:
      - "browser-extension/**"
      - ".github/workflows/browser-extension.yml"
  pull_request:
    paths:
      - "browser-extension/**"
      - ".github/workflows/browser-extension.yml"
  workflow_dispatch:

jobs:
  build-finder:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install local-only OCR dependencies
        working-directory: browser-extension
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Test Finder heuristics
        working-directory: browser-extension
        run: npm test
      - name: Build diagnostic extension
        working-directory: browser-extension
        run: |
          npm run build
          npm run verify
          node --check background.js
          node --check finder-core.js
          node --check finder-text.js
          node --check finder-fit.js
          node --check finder-auto.js
          node --check finder-association.js
          node --check finder-shortcut.js
          node --check finder-instances.js
          node --check finder-language.js
          node --check finder-offscreen.js
          node --check finder-content.js
      - name: Create preview ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd browser-extension/dist
          zip -q -r "$GITHUB_WORKSPACE/PageTranslator-Finder-v0.6.0-preview.zip" .
          test -f "$GITHUB_WORKSPACE/PageTranslator-Finder-v0.6.0-preview.zip"
          unzip -t "$GITHUB_WORKSPACE/PageTranslator-Finder-v0.6.0-preview.zip" >/dev/null
      - name: Upload Finder preview
        uses: actions/upload-artifact@v4
        with:
          name: PageTranslator-Finder-v0.6.0-preview
          path: PageTranslator-Finder-v0.6.0-preview.zip
          if-no-files-found: error
          retention-days: 30
