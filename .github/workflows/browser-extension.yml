name: Browser Finder · Diagnostic Preview

on:
  push:
    paths:
      - "browser-extension/**"
      - ".github/workflows/browser-extension.yml"
  pull_request:
    paths:
      - "browser-extension/**"
      - ".github/workflows/browser-extension.yml"
  workflow_dispatch:

jobs:
  build-finder:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate PDF QA Python script (without distributing any comic pages)
        run: python -m py_compile tools/qa_pdf.py
      - name: Install local-only OCR dependencies
        working-directory: browser-extension
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Test Finder heuristics
        working-directory: browser-extension
        run: npm test
      - name: Build diagnostic extension
        working-directory: browser-extension
        run: |
          npm run build
          npm run verify
          node --check background.js
          node --check finder-core.js
          node --check finder-panels.js
          node --check finder-ocr-runtime.js
          node --check finder-text.js
          node --check finder-fit.js
          node --check finder-auto.js
          node --check finder-association.js
          node --check finder-shortcut.js
          node --check finder-instances.js
          node --check finder-language.js
          node --check finder-offscreen.js
          node --check regions.js
          node --check finder-content.js
      - name: Real Chrome smoke (panel geometry in browser)
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$CHROME" ]]; then echo 'Browser not installed'; exit 1; fi
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --virtual-time-budget=4000 \\
            --dump-dom "file://$GITHUB_WORKSPACE/browser-extension/tests/panels-browser-smoke.html" \\
            > browser-smoke.html 2> browser-smoke.log
          grep -q 'PASS_BROWSER_PANELS' browser-smoke.html
          echo 'Panel geometry executed successfully in Chromium.'
      - name: Create preview ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd browser-extension/dist
          zip -q -r "$GITHUB_WORKSPACE/PageTranslator-Finder-v0.7.1-preview.zip" .
          test -f "$GITHUB_WORKSPACE/PageTranslator-Finder-v0.7.1-preview.zip"
          unzip -t "$GITHUB_WORKSPACE/PageTranslator-Finder-v0.7.1-preview.zip" >/dev/null
      - name: Upload Finder preview
        uses: actions/upload-artifact@v4
        with:
          name: PageTranslator-Finder-v0.7.1-preview
          path: PageTranslator-Finder-v0.7.1-preview.zip
          if-no-files-found: error
          retention-days: 30
